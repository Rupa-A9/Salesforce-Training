<template>

    <lightning-card title="Student Dashboard">

        <template if:true={students}>

            <div class="slds-p-around_medium">

                <template for:each={students} for:item="stu">

                    <div key={stu.Id}
                         class="slds-box slds-m-bottom_small">

                        <p>
                            <strong>Name:</strong>
                            {stu.Name}
                        </p>

                        <p>
                            <strong>Attendance:</strong>
                            {stu.Attendance_Percentage__c}
                        </p>

                        <p>
                            <strong>Fees Paid:</strong>
                            {stu.Fees_Paid__c}
                        </p>

                        <p>
                            <strong>Eligible:</strong>
                            {stu.Eligible__c}
                        </p>

                    </div>

                </template>

            </div>

        </template>

    </lightning-card>

</template>
